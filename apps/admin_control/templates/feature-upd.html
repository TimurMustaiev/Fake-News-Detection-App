{% extends "custom/base.html" %}
{% load static %}
{% load i18n %}
{% load crispy_forms_tags %}
{% block title %}Редагування ознаки моделі{% endblock title %}
{% block content %}
    <h1 class="mt-2 mb-3">Оберіть нову ознаку</h1>
    <form id="update-form" name="update-form" class="w-25 mx-auto" method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-primary">Оновити ознаку</button>
    </form>
{% endblock content %}
